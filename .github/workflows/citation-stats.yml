name: Citation stats

on:
  schedule:
    - cron: "0 7 * * 1"   # weekly, Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch citation stats -> stats/*.json
        run: python scripts/fetch_citations.py

      - name: Publish badge JSON to citation-stats branch
        run: |
          cd stats
          git init -q
          git checkout -q -b citation-stats
          git add .
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update citation stats"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" citation-stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

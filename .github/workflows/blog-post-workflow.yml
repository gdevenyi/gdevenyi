name: Latest blog posts

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull latest blog posts into README
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://gabriel.devenyi.ca/feed.xml"
          max_post_count: 5
